# NATS server for the Reply Center bus.
#
# JetStream is on so the outbox relay publishes into a durable stream and the
# consumers get at-least-once redelivery. A dedicated system account is defined
# because nats-surveyor scrapes server metrics over $SYS.

server_name: reply-center-nats
http: 8222            # monitoring endpoint (/healthz, /varz, ...)

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 268435456     # 256 MiB
  max_file_store: 1073741824      # 1 GiB
}

accounts {
  APP: {
    jetstream: enabled
    users: [
      { user: app, password: app }
    ]
  }
  SYS: {
    users: [
      { user: sys, password: sys }
    ]
  }
}

# Surveyor connects here to read server/account stats.
system_account: SYS
